{% extends "custparent.html" %}
{% block body %}
    <div class="row">
        <div class="col-sm-12">
            <h1 class="text-center mb-4">Available Cars</h1>
            
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Car Name</th>
                            <th>Car Number</th>
                            <th>Driver Name</th>
                            <th>Rent (per day)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for car in carinfo %}
                        <tr>
                            <td>{{car.carname}}</td>
                            <td>{{car.carno}}</td>
                            <td>{{car.drivername}}</td>
                            <td>₹{{car.carrent}}</td>
                            <td>
                                <a href="{% url 'custapp:book' car.carid %}" class="btn btn-primary">Book Now</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center">No cars available at the moment.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock body %}
