{% extends "custparent.html" %}
{% block body %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center mb-4">Payment Details</h1>
        
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Booking Summary</h4>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <img src="{{car.carpic.url}}" class="img-fluid rounded" alt="{{car.carname}}">
                            </div>
                            <div class="col-md-6">
                                <h5>{{car.carname}}</h5>
                                <p><strong>Car Number:</strong> {{car.carno}}</p>
                                <p><strong>Driver:</strong> {{car.drivername}}</p>
                                <p><strong>Rent per day:</strong> ₹{{car.carrent}}</p>
                            </div>
                        </div>

                        <form method="post" action="{% url 'custapp:process_payment' car.carid %}">
                            {% csrf_token %}
                            <div class="form-group mb-3">
                                <label>Payment Method</label>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="payment_method" id="credit_card" value="credit_card" checked>
                                    <label class="form-check-label" for="credit_card">
                                        Credit Card
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="payment_method" id="debit_card" value="debit_card">
                                    <label class="form-check-label" for="debit_card">
                                        Debit Card
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="payment_method" id="upi" value="upi">
                                    <label class="form-check-label" for="upi">
                                        UPI
                                    </label>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="card_number">Card Number</label>
                                <input type="text" class="form-control" id="card_number" name="card_number" required pattern="[0-9]{16}" placeholder="1234 5678 9012 3456">
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="expiry">Expiry Date</label>
                                        <input type="text" class="form-control" id="expiry" name="expiry" required pattern="(0[1-9]|1[0-2])\/([0-9]{2})" placeholder="MM/YY">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="cvv">CVV</label>
                                        <input type="text" class="form-control" id="cvv" name="cvv" required pattern="[0-9]{3}" placeholder="123">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="name">Name on Card</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Pay ₹{{car.carrent}}</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Format card number input
    document.getElementById('card_number').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 16) value = value.slice(0, 16);
        e.target.value = value;
    });

    // Format expiry date input
    document.getElementById('expiry').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length >= 2) {
            value = value.slice(0, 2) + '/' + value.slice(2, 4);
        }
        e.target.value = value;
    });

    // Format CVV input
    document.getElementById('cvv').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 3) value = value.slice(0, 3);
        e.target.value = value;
    });
</script>
{% endblock body %}
