{% extends "custparent.html" %}
{% block body %}
    <div class="row">
        <div class="col-sm-12">
            <h1 style="text-align:center;">Submit Complaint</h1>
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{message}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            {% endif %}
            <div class="col-sm-8 mx-auto">
                <form method="post" class="form-group">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-light">Your Complaint</label>
                        <textarea class="form-control text-light" name="complaint" rows="5" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-danger">Submit Complaint</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock body %}
