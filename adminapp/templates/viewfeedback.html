{% extends "adminparent.html" %}
{% block body %}
    <div class="row">
        <div class="col-sm-12">
            <h1 style="text-align:center;">Customer Feedback</h1>   
            <div class="table-responsive">
                <table class="table table-bordered text-light">
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Contact No</th>
                        <th>Email</th>
                        <th>Feedback</th>
                        <th>Date</th>      
                    </tr>
                    {% for f in feedbacks %}
                        <tr>
                            <td>{{forloop.counter}}</td>                                      
                            <td>{{f.name}}</td>                                       
                            <td>{{f.contactno}}</td>                                       
                            <td>{{f.emailaddress}}</td>                                       
                            <td>{{f.feedback}}</td>                                       
                            <td>{{f.feedbackdate}}</td>                                       
                        </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
{% endblock body %}
